resolver 1.1.1.1 ipv6=off valid=300s;

server {
  listen 8000;

  # Injects the headers OpenCode Go requires (x-opencode-session, identifiable
  # user agent) and forwards everything to https://opencode.ai unchanged.
  location / {
    set $upstream https://opencode.ai;
    proxy_pass $upstream;
    proxy_ssl_server_name on;

    proxy_set_header Host opencode.ai;
    proxy_set_header X-Opencode-Session "pentagi-skeleton";
    proxy_set_header User-Agent "pentagi-selfhosted/0.1 (gateway)";

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # LLM responses are streamed (SSE); don't buffer, allow long generations
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
